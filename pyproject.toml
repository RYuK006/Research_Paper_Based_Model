[project]
name = "research-paper-collector"
version = "0.2.0"
description = "High-performance bulk research paper collection, parsing (LaTeX & PDF with equations and tables), and metadata harvesting pipeline for arXiv, OpenAlex, and Semantic Scholar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
